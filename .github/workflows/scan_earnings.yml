name: scan-earnings

on:
  schedule:
    # UTC 2:00 / 10:00 / 14:00 = 北京 10:00 / 18:00 / 22:00，覆盖盘后与晚间披露
    - cron: "0 2,10,14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: scan-earnings
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: install deps
        run: pip install -r requirements-automation.txt

      - name: git identity（供中途分批提交）
        run: |
          git config user.name "yeji-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: scan & build briefs
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          MAX_BRIEFS: 40
          PYTHONUNBUFFERED: "1"   # 日志实时刷出，避免看起来卡死被误取消
          AI_TIMEOUT: "60"        # 批处理模式收紧单次读超时（默认 120）
          AI_RETRIES: "2"         # 批处理模式减少重试轮数，连续失败由熔断兕底
        run: python automation/scan_and_brief.py --watchlist watchlist.json --reports-dir reports --max-briefs "$MAX_BRIEFS" --commit-every 10

      - name: commit & push
        run: |
          git add reports/
          if git diff --cached --quiet; then
            echo "无新快报（或已由中途分批提交覆盖）"
          else
            git commit -m "auto: 业绩快报更新 $(date -u +%F)"
            git push
          fi

      - name: notify issue
        if: hashFiles('finreport_work/scan_result.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(python -c "import json;print(len(json.load(open('finreport_work/scan_result.json'))['briefs']))")
          if [ "$COUNT" -gt 0 ]; then
            BODY=$(python -c "
          import json
          d = json.load(open('finreport_work/scan_result.json'))
          lines = ['## 自动业绩快报', '',
                   f\"模式：{d['mode']} ｜ 全市场候选 {d['market_candidates']} ｜ 生成 {len(d['briefs'])} ｜ 积压顺延 {d['backlog']} ｜ 新浪未同步跳过 {d['skipped_sync']}\", '']
          wl = [b for b in d['briefs'] if b['watchlist']]
          if wl:
              lines.append('**Watchlist 命中：**')
              for b in wl:
                  lines += [f\"- {b['name']} ({b['code']}) {b['period']} — 评级 {b['grade']}\", '', b['summary'], '']
          rest = [b for b in d['briefs'] if not b['watchlist']]
          if rest:
              lines.append('**全市场新披露（纯量化快报）：** ' + '、'.join(f\"{b['name']}({b['grade']})\" for b in rest[:20]) + ('…' if len(rest) > 20 else ''))
          lines += ['', '> AI 量化快报，无人工复核；完整分析请本地运行 /fin-report <code>']
          print('\n'.join(lines))
          ")
            gh issue create --title "📈 新财报快报：$COUNT 家公司已发布" --body "$BODY"
          else
            echo "无新披露，不建 issue"
          fi
