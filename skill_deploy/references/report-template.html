<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #020617;
    --panel: #0F172A;
    --panel-2: #16213A;
    --ink: #F8FAFC;
    --sub: #94A3B8;
    --line: #1E293B;
    --good: #22C55E;
    --good-strong: #4ADE80;
    --good-bg: rgba(34, 197, 94, 0.10);
    --bad: #FB7185;
    --bad-bg: rgba(251, 113, 133, 0.10);
    --warn: #FBBF24;
    --warn-bg: rgba(251, 191, 36, 0.10);
    --accent: #38BDF8;
    --accent-dim: rgba(56, 189, 248, 0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "IBM Plex Sans", "Segoe UI", "Microsoft YaHei", -apple-system, sans-serif;
    color: var(--ink); background: var(--bg);
    line-height: 1.65; padding: 0 0 48px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* ===== 头部 ===== */
  header {
    background: linear-gradient(180deg, #0B1226 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
    padding: 28px 0 20px; margin-bottom: 20px;
  }
  .crumb {
    color: var(--sub); font-size: 13px; letter-spacing: 0.02em;
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .crumb .code-badge {
    font-variant-numeric: tabular-nums;
    color: var(--accent); background: var(--accent-dim);
    border: 1px solid rgba(56, 189, 248, 0.25);
    border-radius: 6px; padding: 1px 8px; font-weight: 600;
  }
  h1 { font-size: 26px; font-weight: 700; margin: 10px 0 4px; letter-spacing: -0.01em; }
  h1 .period { color: var(--accent); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    font-size: 12px; color: #CBD5E1;
    border: 1px solid var(--line); background: var(--panel);
    border-radius: 999px; padding: 3px 12px;
  }

  /* ===== AI 总结横幅 ===== */
  .summary {
    background: linear-gradient(135deg, var(--panel-2) 0%, var(--panel) 100%);
    border: 1px solid var(--line); border-left: 3px solid var(--sum-tone, var(--accent));
    border-radius: 12px; padding: 18px 20px; margin: 20px 0 8px;
  }
  .summary[data-tone="good"] { --sum-tone: var(--good); }
  .summary[data-tone="bad"]  { --sum-tone: var(--bad); }
  .summary[data-tone="warn"] { --sum-tone: var(--warn); }
  .summary .summary-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; color: var(--sub);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px;
  }
  .summary .summary-text { font-size: 14.5px; line-height: 1.8; }
  .summary .summary-links {
    display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px;
    padding-top: 12px; border-top: 1px solid var(--line);
  }
  .summary .summary-links a {
    font-size: 12.5px; color: var(--accent);
    background: var(--accent-dim); border: 1px solid rgba(56,189,248,0.25);
    border-radius: 999px; padding: 3px 12px;
    transition: background-color 200ms ease;
  }
  .summary .summary-links a:hover { background: rgba(56,189,248,0.22); }

  @media print {
    .summary { background: #F8FAFC; border-color: #E5E7EB; border-left-color: #1D4ED8; }
    .summary .summary-head { color: #6B7280; }
    .summary .summary-links a { color: #1D4ED8; background: #EFF6FF; border-color: #BFDBFE; }
  }

  /* ===== 指标卡片 ===== */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin: 20px 0 8px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px;
    position: relative; overflow: hidden;
    transition: border-color 200ms ease;
  }
  .card:hover { border-color: #334155; }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--card-tone, var(--line));
  }
  .card[data-tone="good"] { --card-tone: var(--good); }
  .card[data-tone="bad"]  { --card-tone: var(--bad); }
  .card[data-tone="warn"] { --card-tone: var(--warn); }
  .card .label { font-size: 12.5px; color: var(--sub); font-weight: 500; }
  .card .value {
    font-size: 24px; font-weight: 700; margin: 6px 0 8px;
    font-variant-numeric: tabular-nums; letter-spacing: -0.01em;
  }
  .tag {
    display: inline-block; font-size: 12px; font-weight: 600;
    border-radius: 6px; padding: 2px 9px;
  }
  .tag.good { color: var(--good-strong); background: var(--good-bg); border: 1px solid rgba(34,197,94,0.25); }
  .tag.bad  { color: var(--bad);       background: var(--bad-bg);  border: 1px solid rgba(251,113,133,0.25); }
  .tag.warn { color: var(--warn);      background: var(--warn-bg); border: 1px solid rgba(251,191,36,0.25); }

  /* ===== 章节 ===== */
  section {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px 22px; margin: 16px 0;
    scroll-margin-top: 16px;
  }
  section h2 {
    font-size: 17px; font-weight: 700; margin-bottom: 10px;
    padding-left: 10px; border-left: 3px solid var(--accent);
    line-height: 1.4;
  }
  section .intro { color: var(--sub); font-size: 13.5px; margin-bottom: 12px; }

  /* ===== 表格 ===== */
  .table-scroll { overflow-x: auto; border-radius: 8px; border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin: 8px 0; }
  th {
    text-align: left; color: var(--sub); font-weight: 600;
    background: var(--panel-2); border-bottom: 1px solid var(--line);
    padding: 8px 12px; white-space: nowrap; font-size: 12.5px;
    letter-spacing: 0.02em;
  }
  td {
    border-bottom: 1px solid rgba(30, 41, 59, 0.6);
    padding: 8px 12px; font-variant-numeric: tabular-nums;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background-color 150ms ease; }
  tbody tr:hover { background: rgba(56, 189, 248, 0.05); }
  tr.row-good td { background: var(--good-bg); }
  tr.row-good:hover td { background: rgba(34, 197, 94, 0.16); }
  tr.row-bad td { background: var(--bad-bg); }
  tr.row-bad:hover td { background: rgba(251, 113, 133, 0.16); }
  tr.row-warn td { background: var(--warn-bg); }

  /* ===== 结论与注释 ===== */
  .conclusion {
    border-radius: 8px; padding: 12px 14px; font-size: 14px; margin-top: 10px;
    border: 1px solid transparent; line-height: 1.7;
  }
  .conclusion.good { background: var(--good-bg); color: var(--good-strong); border-color: rgba(34,197,94,0.25); }
  .conclusion.bad  { background: var(--bad-bg);  color: var(--bad);       border-color: rgba(251,113,133,0.25); }
  .conclusion.warn { background: var(--warn-bg); color: var(--warn);      border-color: rgba(251,191,36,0.25); }
  .note {
    color: var(--sub); font-size: 12.5px; margin-top: 8px;
    padding-left: 12px; border-left: 2px solid var(--line);
    line-height: 1.7;
  }

  /* ===== 页脚 ===== */
  footer {
    color: var(--sub); font-size: 12px; border-top: 1px solid var(--line);
    margin-top: 28px; padding-top: 14px; line-height: 1.8;
  }

  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px;
  }

  @media (max-width: 640px) {
    h1 { font-size: 21px; }
    .card .value { font-size: 20px; }
    section { padding: 16px 14px; }
  }

  /* 打印：转亮色（财报常另存 PDF） */
  @media print {
    body { background: #fff; color: #111827; }
    header { background: #fff; border-bottom: 2px solid #111; }
    .crumb, .note, footer { color: #4B5563; }
    h1 .period { color: #1D4ED8; }
    .chip { background: #fff; border-color: #D1D5DB; color: #374151; }
    .crumb .code-badge { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }
    section, .card { background: #fff; border-color: #E5E7EB; }
    section h2 { border-left-color: #1D4ED8; color: #111827; }
    th { background: #F3F4F6; color: #374151; }
    td { border-bottom-color: #E5E7EB; }
    tbody tr:hover { background: transparent; }
    .tag.good, .conclusion.good { color: #15803D; background: #F0FDF4; border-color: #BBF7D0; }
    .tag.bad, .conclusion.bad { color: #BE123C; background: #FFF1F2; border-color: #FECDD3; }
    .tag.warn, .conclusion.warn { color: #A16207; background: #FEFCE8; border-color: #FEF08A; }
    tr.row-good td { background: #F0FDF4; }
    tr.row-bad td { background: #FFF1F2; }
    tr.row-warn td { background: #FEFCE8; }
    .table-scroll { overflow: visible; }
    section { break-inside: avoid-page; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    tbody tr, .card { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crumb">
      <span class="code-badge">{{META.code}}</span>
      <span>{{META.period_label}}</span>
      <span>·</span>
      <span>完整业绩判断 · 评级 + 预期对照</span>
    </div>
    <h1>{{META.name}} <span class="period">{{META.period_label}}</span> 财报分析</h1>
    <div class="chips">
      <span class="chip">只列事实与数字</span>
      <span class="chip">五维评分卡可复算</span>
      <span class="chip">机构预测逐家溯源</span>
      <span class="chip">反推算式可查</span>
      <span class="chip">已剔除无原文依据机构</span>
    </div>
  </header>

  {{SUMMARY}}

  <div class="cards">
    {{CARDS}}
  </div>

  {{SECTIONS}}

  <footer>
    生成于 {{META.generated}} · {{META.disclaimer}}
  </footer>
</div>
</body>
</html>
